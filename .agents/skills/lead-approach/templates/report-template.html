<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{{ TITLE }}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

    @page {
      size: A4 portrait;
      margin: 12mm 14mm 12mm 14mm;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      background: #ffffff;
      line-height: 1.45;
      font-size: 11.5px;
      -webkit-font-smoothing: antialiased;
    }

    .page-break {
      page-break-before: always;
    }

    .avoid-break {
      page-break-inside: avoid;
    }

    .header {
      border-bottom: 2px solid #8338ec;
      padding-bottom: 14px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .brand-tag {
      display: inline-block;
      background: #8338ec;
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .main-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }

    .main-subtitle {
      font-size: 11.5px;
      color: #64748b;
      margin-top: 3px;
      font-weight: 500;
    }

    .header-meta {
      text-align: right;
      font-size: 10.5px;
      color: #64748b;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      line-height: 1.4;
    }

    .header-meta strong {
      color: #0f172a;
      font-size: 11px;
    }

    .section-title {
      font-size: 12.5px;
      font-weight: 800;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 14px;
      background: #8338ec;
      border-radius: 2px;
    }

    .lead-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
      background: #ffffff;
      page-break-inside: avoid;
    }

    .lead-header {
      background: #0f172a;
      color: #ffffff;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lead-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lead-num {
      background: #8338ec;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 10px;
    }

    .lead-handle {
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
    }

    .lead-subname {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }

    .lead-body {
      padding: 10px 12px;
    }

    .lead-meta-row {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr 1.6fr;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 6px 10px;
      border-radius: 5px;
      margin-bottom: 8px;
      font-size: 10.5px;
    }

    .meta-col strong {
      display: block;
      color: #64748b;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 1px;
    }

    .meta-col span {
      color: #0f172a;
      font-weight: 600;
    }

    .msg-box {
      background: #fdf4ff;
      border: 1px solid #f5d0fe;
      border-left: 3px solid #8338ec;
      border-radius: 5px;
      padding: 9px 11px;
      font-size: 10.5px;
      line-height: 1.45;
      color: #2e1065;
      white-space: pre-wrap;
      margin-bottom: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .msg-box .link-highlight {
      font-weight: 700;
      color: #7e22ce;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      display: inline-block;
      margin: 3px 0;
    }

    .follow-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 10px;
      color: #334155;
      line-height: 1.35;
    }

    .follow-box strong {
      color: #0f172a;
      display: inline-block;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-right: 4px;
    }

    .badge-pill {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-esp { background: #fef08a; color: #854d0e; }
    .badge-us { background: #bfdbfe; color: #1e40af; }
    .badge-pt { background: #bbf7d0; color: #166534; }

    .page-footer {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <!-- Conteúdo Injetado Dinamicamente -->
  {{ CONTENT }}
</body>
</html>
